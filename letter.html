<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>Write a Letter | Letters I Never Sent</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        min-height: 100vh;
        padding: 30px 18px;
        background: #241f1b;
        color: #3d332b;
        font-family: Georgia, serif;
    }
    .container {
        max-width: 650px;
        margin: auto;
    }
    h1 {
        text-align: center;
        color: #e8dcc8;
        font-weight: normal;
        font-size: 34px;
        margin-bottom: 8px;
    }
    .subtitle {
        text-align: center;
        color: #cbbda9;
        font-style: italic;
        line-height: 1.6;
        margin-bottom: 30px;
    }
    .paper {
        background: #e8dcc8;
        padding: 30px 25px;
        box-shadow:
            0 15px 40px rgba(0,0,0,.4);
    }
    .intro {
        text-align: center;
        line-height: 1.7;
        margin-bottom: 28px;
    }
    .intro strong {
        font-size: 20px;
        font-weight: normal;
    }
    label {
        display: block;
        margin-top: 20px;
        margin-bottom: 7px;
        font-size: 15px;
    }
    input,
    textarea {
        width: 100%;
        border: 1px solid #b9aa94;
        background: #f1e7d6;
        color: #3d332b;
        padding: 13px;
        font-family: Georgia, serif;
        font-size: 16px;
        outline: none;
    }
    input:focus,
    textarea:focus {
        border-color: #796a58;
    }
    textarea {
        min-height: 300px;
        resize: vertical;
        line-height: 1.8;
    }
    input::placeholder,
    textarea::placeholder {
        color: #887967;
    }
    .hint {
        font-size: 13px;
        font-style: italic;
        opacity: .7;
        line-height: 1.5;
    }
    button {
        display: block;
        width: 100%;
        margin-top: 28px;
        padding: 16px;
        border: none;
        background: #3d332b;
        color: #e8dcc8;
        font-family: Georgia, serif;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: #51443a;
    }
    button:active {
        transform: scale(.98);
    }
    .back {
        text-align: center;
        margin-top: 20px;
    }
    .back a {
        color: #cbbda9;
        text-decoration: none;
    }
</style>
</head>
<body>
<div class="container">
<h1>
    Letters I Never Sent
</h1>
<p class="subtitle">
    Some words are too difficult to say out loud.
</p>
<div class="paper">
    <div class="intro">
        <strong>
            Maybe it's time to let them read it.
        </strong>
        <br>
        Write the letter you never found
        the courage to send.
    </div>
    <label for="name">
        Who is this letter for?
    </label>
    <input
        id="name"
        type="text"
        placeholder="Their name..."
    >
    <label for="message">
        The letter you never sent
    </label>
    <textarea
        id="message"
        placeholder="Dear you,

There are so many things I’ve wanted to say…

Write everything you never got to say here.”
>

    <p class="hint">
        You don't need to make it perfect.
        Just be honest.
    </p>
    <label for="song">
        A song that belongs to this letter
    </label>
    <input
        id="song"
        type="text"
        placeholder="Paste a YouTube link (optional)"
    >
    <button onclick="createLetter()">
        Let Them Read It 💌
    </button>
</div>
<div class="back">
    <a href="index.html">
        ← Back home
    </a>
</div>
</div>
<script>
function createLetter() {
    const name =
        document.getElementById("name").value.trim();
    const message =
        document.getElementById("message").value.trim();
    const song =
        document.getElementById("song").value.trim();
    if (name === "") {
        alert(
            "Who is this letter for? 💌"
        );
        return;
    }
    if (message === "") {
        alert(
            "Write your letter first. 💌"
        );
        return;
    }
    const data = {
        name: name,
        message: message,
        song: song
    };
    const encoded = btoa(
        encodeURIComponent(
            JSON.stringify(data)
        )
    );
    window.location.href =
        "preview.html?letter=" +
        encoded;
}
</script>
</body>
</html>
