<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letters I Never Sent</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 30px 18px;
    min-height: 100vh;
    background: #241f1b;
    color: #3d332b;
    font-family: Georgia, serif;
}
.container {
    max-width: 650px;
    margin: auto;
}
h1 {
    text-align: center;
    color: #e8dcc8;
    font-size: 34px;
    font-weight: normal;
}
.subtitle {
    text-align: center;
    color: #cbbda9;
    font-style: italic;
    line-height: 1.7;
}
.paper {
    background: #e8dcc8;
    padding: 28px 24px;
    margin-top: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,.4);
}
label {
    display: block;
    margin: 20px 0 8px;
}
input,
textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #b9aa94;
    background: #f1e7d6;
    color: #3d332b;
    font-family: Georgia, serif;
    font-size: 16px;
}
textarea {
    min-height: 300px;
    resize: vertical;
    line-height: 1.8;
}
button {
    width: 100%;
    padding: 16px;
    margin-top: 25px;
    border: none;
    background: #3d332b;
    color: #e8dcc8;
    font-family: Georgia, serif;
    font-size: 16px;
    cursor: pointer;
}
.back {
    text-align: center;
    margin-top: 20px;
}
.back a {
    color: #cbbda9;
    text-decoration: none;
}
/* PREVIEW */
#preview {
    display: none;
}
.quote {
    margin: 30px 0;
    text-align: center;
    color: #cbbda9;
    font-style: italic;
    line-height: 1.8;
    font-size: 17px;
}
.quote-mark {
    font-size: 35px;
}
.letter {
    background: #e8dcc8;
    padding: 35px 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,.45);
}
.letter-title {
    text-align: center;
    color: #796a58;
    font-style: italic;
    font-size: 14px;
    margin-bottom: 35px;
}
.dear {
    font-size: 21px;
    margin-bottom: 25px;
}
.message {
    white-space: pre-wrap;
    line-height: 1.9;
    font-size: 17px;
}
.song {
    padding: 18px;
    margin-bottom: 28px;
    background: #ded1bd;
    border: 1px solid #b9aa94;
    text-align: center;
}
.song-title {
    font-size: 18px;
}
.song-note {
    margin-top: 7px;
    font-size: 13px;
    font-style: italic;
}
.song a {
    display: inline-block;
    margin-top: 12px;
    color: #3d332b;
    word-break: break-all;
}
.share {
    background: #e8dcc8;
    padding: 25px;
    margin-top: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
}
.share h2 {
    text-align: center;
    font-weight: normal;
}
.share p {
    text-align: center;
    color: #5f5348;
    font-style: italic;
}
.share input {
    font-family: Arial, sans-serif;
    font-size: 12px;
}
.success {
    display: none;
    text-align: center;
    margin-top: 15px;
    color: #5f5348;
    font-style: italic;
}
</style>
</head>
<body>
<div class="container">
<!-- WRITING -->
<div id="writing">
<h1>
    Write a Letter
</h1>
<p class="subtitle">
    For the words you never got to say.
</p>
<div class="paper">
<label>
    Name
</label>

<input
id=“name”
type=“text”
placeholder=“Binkles…”

<label>
    Song
</label>

<input
id=“song”
type=“text”
placeholder=“Paste a YouTube link (optional)”

<label>
    Letter
</label>
<textarea
    id="message"
    placeholder="Dear you,
I just wanted to say..."
></textarea>

<button
type=“button”
id=“createButton”

Create Letter 💌
</button>
</div>
<div class="back">
<a href="index.html">
    ← Back home
</a>
</div>
</div>
<!-- PREVIEW -->
<div id="preview">
<h1>
    Your Letter 💌
</h1>
<!-- MOTIVATIONAL QUOTE -->
<div class="quote">
<div class="quote-mark">
    “
</div>
<div id="quote"></div>
<div class="quote-mark">
    ”
</div>
</div>
<!-- FINISHED LETTER -->
<div class="letter">
<div class="letter-title">
    Letters I Never Sent
</div>
<div class="dear">

Dear ,

</div>
<div
    class="song"
    id="showSong"
>
<div class="song-title">
    🎵 Playing song
</div>
<div class="song-note">
    Please play the song while reading.
</div>

<a
id=“songURL”
href=”#”
target=”_blank”

Play the song 🎵
</a>
</div>
<div
    class="message"
    id="showMessage"
></div>
</div>
<!-- COPY -->
<div class="share">
<h2>
    Your letter is ready. 💌
</h2>
<p>
    Copy this link and send it to them.
</p>

<input
id=“copyLink”
type=“text”
readonly

<button
type=“button”
id=“copyButton”

Copy Letter Link 🔗
</button>
<div id="copied" class="success">
Link copied! Now you can send it. 🤍
</div>
</div>
</div>
</div>
<script>
const quotes = [
"Some feelings are too deep to say out loud, but that doesn't mean they should stay unsaid.",
"Maybe the words you've been keeping inside deserve to reach the person they're meant for.",
"You don't need perfect words. Just say what your heart has been trying to say.",
"Sometimes writing down what you feel is the first step toward finally letting it out.",
"Even the words you were afraid to say can become a beautiful memory.",
"Your feelings are worth putting into words, even if your voice could never say them.",
"Some letters are never meant to be perfect. They're simply meant to be honest."
];
document
.getElementById("createButton")
.addEventListener(
    "click",
    createLetter
);
function createLetter() {
    const name =
        document
        .getElementById("name")
        .value
        .trim();
    const song =
        document
        .getElementById("song")
        .value
        .trim();
    const message =
        document
        .getElementById("message")
        .value
        .trim();
    if (name === "") {
        alert(
            "Please enter their name. 💌"
        );
        return;
    }
    if (message === "") {
        alert(
            "Please write your letter first. 💌"
        );
        return;
    }
    /* SHOW LETTER */
    document
    .getElementById("showName")
    .textContent =
        name;
    document
    .getElementById("showMessage")
    .textContent =
        message;
    /* SHOW SONG */
    const songBox =
        document
        .getElementById("showSong");
    const songURL =
        document
        .getElementById("songURL");
    if (song !== "") {
        songBox.style.display =
            "block";
        songURL.href =
            song;
    } else {
        songBox.style.display =
            "none";
    }
    /* RANDOM QUOTE */
    const randomQuote =
        quotes[
            Math.floor(
                Math.random() *
                quotes.length
            )
        ];
    document
    .getElementById("quote")
    .textContent =
        randomQuote;
    /* CREATE LINK */
    const letterData = {
        name: name,
        song: song,
        message: message
    };
    try {
        const encoded =
            btoa(
                encodeURIComponent(
                    JSON.stringify(
                        letterData
                    )
                )
            );
        const baseURL =
            window.location.href
            .split("?")[0]
            .replace(
                "letter.html",
                ""
            );
        const finalLink =
            baseURL +
            "view.html?letter=" +
            encoded;
        document
        .getElementById("copyLink")
        .value =
            finalLink;
    } catch (error) {
        alert(
            "There was a problem creating your letter."
        );
        return;
    }
    /* HIDE WRITING */
    document
    .getElementById("writing")
    .style.display =
        "none";
    /* SHOW PREVIEW */
    document
    .getElementById("preview")
    .style.display =
        "block";
    window.scrollTo(
        0,
        0
    );
}
/* COPY BUTTON */
document
.getElementById("copyButton")
.addEventListener(
    "click",
    function() {
        const input =
            document
            .getElementById("copyLink");
        input.focus();
        input.select();
        input.setSelectionRange(
            0,
            99999
        );
        try {
            document.execCommand(
                "copy"
            );
            document
            .getElementById("copied")
            .style.display =
                "block";
        } catch (error) {
            alert(
                "Please copy the link manually."
            );
        }
    }
);
</script>
</body>
</html>
