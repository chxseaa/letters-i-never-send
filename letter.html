<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name=“viewport”
content=“width=device-width, initial-scale=1.0”

<title>Letters I Never Sent</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 18px;
    background: #241f1b;
    color: #3d332b;
    font-family: Georgia, serif;
}
.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
}
h1 {
    text-align: center;
    color: #e8dcc8;
    font-size: 34px;
    font-weight: normal;
    margin-bottom: 8px;
}
.subtitle {
    text-align: center;
    color: #cbbda9;
    font-style: italic;
    line-height: 1.7;
    margin-bottom: 30px;
}
.paper {
    background: #e8dcc8;
    padding: 30px 25px;
    box-shadow:
        0 15px 40px rgba(0,0,0,.4);
}
label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    font-size: 15px;
}
input,
textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #b9aa94;
    background: #f1e7d6;
    color: #3d332b;
    font-family: Georgia, serif;
    font-size: 16px;
    outline: none;
}
textarea {
    min-height: 330px;
    resize: vertical;
    line-height: 1.8;
}
input:focus,
textarea:focus {
    border-color: #796a58;
}
button {
    width: 100%;
    padding: 16px;
    margin-top: 25px;
    border: none;
    background: #3d332b;
    color: #e8dcc8;
    font-family: Georgia, serif;
    font-size: 16px;
    cursor: pointer;
}
button:active {
    transform: scale(.98);
}
.share-section {
    display: none;
    margin-top: 25px;
    background: #e8dcc8;
    padding: 25px;
    text-align: center;
    box-shadow:
        0 15px 40px rgba(0,0,0,.4);
}
.share-section h2 {
    font-weight: normal;
    font-size: 24px;
    margin-top: 0;
}
.share-section p {
    color: #5f5348;
    font-style: italic;
    line-height: 1.6;
}
.share-link {
    width: 100%;
    padding: 12px;
    background: #f1e7d6;
    border: 1px solid #b9aa94;
    font-family: Arial, sans-serif;
    font-size: 12px;
}
.share-button {
    background: #3d332b;
    color: #e8dcc8;
}
.copy-button {
    background: transparent;
    color: #3d332b;
    border: 1px solid #796a58;
}
.back {
    text-align: center;
    margin-top: 20px;
}
.back a {
    color: #cbbda9;
    text-decoration: none;
}
</style>
</head>
<body>
<div class="container">
<h1>
    Letters I Never Sent
</h1>
<p class="subtitle">
Some words are too difficult to say out loud.
<br>
Write them here.
</p>
<div class="paper">
<label for="name">
    Name
</label>

<input
id=“name”
type=“text”
placeholder=“Their name…”

<label for="song">
    Song
</label>

<input
id=“song”
type=“text”
placeholder=“Paste a YouTube link…”

<label for="message">
    Letter
</label>
<textarea
    id="message"
    placeholder="Dear you,
I don't really know how to say this...
There are so many things I've wanted to tell you.
Write your letter here..."
></textarea>
<button onclick="createLetter()">
Create Letter 💌
</button>
</div>
<div
    class="share-section"
    id="shareSection"
>
<h2>
    Your letter is ready. 💌
</h2>
<p>
Your letter has been created.
<br>
Send this link to the person
you wrote it for.
</p>

<input
class=“share-link”
id=“shareLink”
readonly

<button
class=“share-button”
onclick=“shareLetter()”

Share the Letter 💌
</button>

<button
class=“copy-button”
onclick=“copyLink()”

Copy Letter Link 🔗
</button>
</div>
<div class="back">
<a href="index.html">
← Back home
</a>
</div>
</div>
<script>
function createLetter() {
    const name =
        document
        .getElementById("name")
        .value
        .trim();
    const song =
        document
        .getElementById("song")
        .value
        .trim();
    const message =
        document
        .getElementById("message")
        .value
        .trim();
    if (!name) {
        alert(
            "Please enter their name. 💌"
        );
        return;
    }
    if (!message) {
        alert(
            "Please write your letter. 💌"
        );
        return;
    }
    const data = {
        name: name,
        song: song,
        message: message
    };
    const encoded =
        btoa(
            encodeURIComponent(
                JSON.stringify(data)
            )
        );
    const baseURL =
        window.location.href
        .split("?")[0];
    const link =
        baseURL
        .replace(
            "letter.html",
            "view.html"
        )
        +
        "?letter="
        +
        encodeURIComponent(encoded);
    document.getElementById(
        "shareLink"
    ).value = link;
    document.getElementById(
        "shareSection"
    ).style.display = "block";
    window.scrollTo({
        top:
            document.body.scrollHeight,
        behavior:
            "smooth"
    });
}
function copyLink() {
    const link =
        document.getElementById(
            "shareLink"
        );
    link.select();
    navigator.clipboard
        .writeText(link.value)
        .then(function() {
            alert(
                "Letter link copied! 💌"
            );
        })
        .catch(function() {
            alert(
                "Please copy the link manually."
            );
        });
}
async function shareLetter() {
    const link =
        document.getElementById(
            "shareLink"
        ).value;
    if (navigator.share) {
        try {
            await navigator.share({
                title:
                    "Someone left you a letter 💌",
                text:
                    "Someone left you a letter. Please play the song while reading.",
                url:
                    link
            });
        } catch (error) {
            // Sharing cancelled.
        }
    } else {
        copyLink();
    }
}
</script>
</body>
</html>
