<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letters I Never Send</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 25px 18px;
    min-height: 100vh;
    background: #241f1b;
    font-family: Georgia, serif;
    color: #3d332b;
}
.container {
    max-width: 650px;
    margin: auto;
}
h1 {
    color: #e8dcc8;
    text-align: center;
    font-weight: normal;
    font-size: 34px;
}
.subtitle {
    color: #cbbda9;
    text-align: center;
    font-style: italic;
    line-height: 1.7;
}
.paper {
    background: #e8dcc8;
    padding: 30px 25px;
    margin-top: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,.4);
}
label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
}
input,
textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #b9aa94;
    background: #f1e7d6;
    color: #3d332b;
    font-family: Georgia, serif;
    font-size: 16px;
}
textarea {
    min-height: 300px;
    line-height: 1.8;
    resize: vertical;
}
button {
    width: 100%;
    padding: 16px;
    margin-top: 25px;
    background: #3d332b;
    color: #e8dcc8;
    border: none;
    font-family: Georgia, serif;
    font-size: 16px;
}
.back {
    text-align: center;
    margin-top: 20px;
}
.back a {
    color: #cbbda9;
}
/* PREVIEW */
#preview {
    display: none;
}
.preview-heading {
    color: #e8dcc8;
    text-align: center;
    font-size: 30px;
    font-weight: normal;
}
.quote {
    color: #cbbda9;
    text-align: center;
    font-style: italic;
    line-height: 1.8;
    padding: 20px;
}
.letter {
    background: #e8dcc8;
    padding: 35px 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,.45);
}
.letter-title {
    text-align: center;
    color: #796a58;
    font-style: italic;
    font-size: 14px;
    margin-bottom: 35px;
}
.dear {
    font-size: 21px;
    margin-bottom: 25px;
}
.message {
    white-space: pre-wrap;
    font-size: 17px;
    line-height: 1.9;
}
.song {
    background: #ded1bd;
    border: 1px solid #b9aa94;
    padding: 18px;
    text-align: center;
    margin-bottom: 28px;
}
.song a {
    display: block;
    margin-top: 12px;
    color: #3d332b;
    word-break: break-all;
}
.share {
    background: #e8dcc8;
    padding: 25px;
    margin-top: 25px;
}
.share h2 {
    text-align: center;
    font-weight: normal;
}
.share p {
    text-align: center;
    font-style: italic;
}
#shareLink {
    width: 100%;
    font-family: Arial, sans-serif;
    font-size: 12px;
}
.success {
    display: none;
    text-align: center;
    margin-top: 15px;
    color: #5f5348;
}
</style>
</head>
<body>
<div class="container">
<!-- WRITING -->
<div id="writing">
<h1>
Letters I Never Send
</h1>
<p class="subtitle">
Write the words you never got to say.
</p>
<div class="paper">
<label>
Their name
</label>

<input
id=“name”
type=“text”
placeholder=“Binkles…”

<label>
Song
</label>

<input
id=“song”
type=“text”
placeholder=“YouTube link (optional)”

<label>
Your letter
</label>
<textarea
id="message"
placeholder="Dear you,
I just wanted to tell you..."
></textarea>

<button
id=“create”
type=“button”

Create Letter 💌

</button>
</div>
<div class="back">
<a href="index.html">
← Back home
</a>
</div>
</div>
<!-- PREVIEW -->
<div id="preview">
<h1 class="preview-heading">
Your Letter Is Ready 💌
</h1>
<div class="quote">

“”

</div>
<div class="letter">
<div class="letter-title">
Letters I Never Sent
</div>
<div class="dear">

Dear ,

</div>
<div
id="songBox"
class="song"
>
<strong>
🎵 Playing song
</strong>
<br>
<small>
Please play the song while reading.
</small>

<a
id=“song”
href=”#”
target=”_blank”

Play the song 🎵
</div>
<div
id="letterText"
class="message"
></div>
</div>
<div class="share">
<h2>
Send Your Letter 💌
</h2>
<p>
Copy this link and send it to them.
</p>

<input
id=“shareLink”
readonly

<button
id=“copy”
type=“button”

Copy Letter Link 🔗

</button>
<div
id="success"
class="success"
>

Link copied! 💌

</div>
</div>
</div>
</div>
<script>
/* QUOTES */
var quotes = [
"Some feelings are too deep to say out loud, but they still deserve to be heard.",
"Maybe the words you've been keeping inside deserve to reach the person they're meant for.",
"You don't need perfect words. You just need to be honest.",
"Sometimes writing is the easiest way to say what your heart has been holding.",
"Even the words you were afraid to say can become a beautiful memory."
];
/* CREATE BUTTON */
document.getElementById("create").onclick = function () {
    var name =
        document.getElementById("name").value.trim();
    var song =
        document.getElementById("song").value.trim();
    var message =
        document.getElementById("message").value.trim();
    if (name === "") {
        alert("Please enter their name. 💌");
        return;
    }
    if (message === "") {
        alert("Please write your letter first. 💌");
        return;
    }
    /* SHOW PREVIEW */
    document.getElementById(
        "person"
    ).innerHTML =
        name;
    document.getElementById(
        "letterText"
    ).textContent =
        message;
    /* SONG */
    if (song === "") {
        document.getElementById(
            "songBox"
        ).style.display =
            "none";
    }
    else {
        document.getElementById(
            "songBox"
        ).style.display =
            "block";
        document.getElementById(
            "song"
        ).href =
            song;
    }
    /* QUOTE */
    var random =
        Math.floor(
            Math.random() *
            quotes.length
        );
    document.getElementById(
        "quote"
    ).textContent =
        quotes[random];
    /*
     * MAKE LETTER DATA
     */
    var data = {
        name: name,
        song: song,
        message: message
    };
    /*
     * ENCODE IT
     */
    var encoded =
        btoa(
            encodeURIComponent(
                JSON.stringify(data)
            )
        );
    /*
     * GET CURRENT FOLDER
     */
    var current =
        window.location.href;
    var folder =
        current.substring(
            0,
            current.lastIndexOf("/") + 1
        );
    /*
     * MAKE RECIPIENT LINK
     */
    var link =
        folder +
        "view.html?letter=" +
        encoded;
    document.getElementById(
        "shareLink"
    ).value =
        link;
    /*
     * CHANGE PAGE
     */
    document.getElementById(
        "writing"
    ).style.display =
        "none";
    document.getElementById(
        "preview"
    ).style.display =
        "block";
    window.scrollTo(
        0,
        0
    );
};
/* COPY BUTTON */
document.getElementById("copy").onclick = function () {
    var input =
        document.getElementById("shareLink");
    input.focus();
    input.select();
    try {
        document.execCommand("copy");
        document.getElementById(
            "success"
        ).style.display =
            "block";
    }
    catch (e) {
        alert(
            "Please copy the link manually."
        );
    }
};
</script>
</body>
</html>
