<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>Your Letter Is Ready</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        min-height: 100vh;
        padding: 30px 18px;
        background: #241f1b;
        color: #e8dcc8;
        font-family: Georgia, serif;
    }
    .container {
        max-width: 650px;
        margin: auto;
    }
    h1 {
        text-align: center;
        font-size: 34px;
        font-weight: normal;
        margin-bottom: 10px;
    }
    .subtitle {
        text-align: center;
        color: #cbbda9;
        font-style: italic;
        line-height: 1.7;
    }
    .paper {
        background: #e8dcc8;
        color: #3d332b;
        padding: 35px 25px;
        margin-top: 30px;
        box-shadow:
            0 15px 40px rgba(0,0,0,.4);
    }
    .to {
        font-size: 18px;
        margin-bottom: 25px;
    }
    .message {
        white-space: pre-wrap;
        line-height: 1.8;
        font-size: 17px;
    }
    .song {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #b9aa94;
        font-size: 14px;
        font-style: italic;
    }
    .share-box {
        margin-top: 30px;
        padding: 25px;
        border: 1px solid #796a58;
        text-align: center;
    }
    .share-box strong {
        font-size: 20px;
        font-weight: normal;
    }
    .share-box p {
        color: #cbbda9;
        line-height: 1.7;
        font-size: 14px;
    }
    .link {
        width: 100%;
        padding: 13px;
        border: 1px solid #b9aa94;
        background: #f1e7d6;
        color: #3d332b;
        font-family: Arial, sans-serif;
        font-size: 12px;
    }
    button {
        width: 100%;
        padding: 15px;
        margin-top: 12px;
        border: none;
        background: #e8dcc8;
        color: #3d332b;
        border: 1px solid #796a58;
        font-family: Georgia, serif;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: #f1e7d6;
    }
    .back {
        text-align: center;
        margin-top: 20px;
    }
    .back a {
        color: #cbbda9;
        text-decoration: none;
    }
</style>
</head>
<body>
<div class="container">
<h1>
    Your Letter Is Ready
</h1>
<p class="subtitle">
    You wrote the words.
    <br>
    Now let them reach the person
    they're meant for.
</p>
<div class="paper">
    <div class="to">
        To:
        <span id="name"></span>
    </div>
    <div
        class="message"
        id="message"
    ></div>
    <div
        class="song"
        id="song"
    ></div>
</div>
<div class="share-box">
    <strong>
        Give them the letter 💌
    </strong>
    <p>
        Copy the link below and send it
        to them.
        <br>
        They will see the letter
        when they open it.
    </p>
    <input
        class="link"
        id="shareLink"
        readonly
    >
    <button onclick="copyLink()">
        Copy Letter Link 🔗
    </button>
    <button onclick="shareLetter()">
        Share Letter 💌
    </button>
</div>
<div class="back">
    <a href="letter.html">
        ← Write another letter
    </a>
</div>
</div>
<script>
function getLetter() {
    const params =
        new URLSearchParams(
            window.location.search
        );
    const encoded =
        params.get("letter");
    if (!encoded) {
        alert(
            "No letter found."
        );
        return null;
    }
    try {
        return JSON.parse(
            decodeURIComponent(
                atob(encoded)
            )
        );
    } catch (error) {
        alert(
            "This letter link is invalid."
        );
        return null;
    }
}
const letter = getLetter();
if (letter) {
    document.getElementById(
        "name"
    ).textContent =
        letter.name;
    document.getElementById(
        "message"
    ).textContent =
        letter.message;
    const songElement =
        document.getElementById("song");
    if (letter.song) {
        songElement.textContent =
            "🎵 " + letter.song;
    } else {
        songElement.style.display =
            "none";
    }
    const currentURL =
        window.location.href;
    const viewURL =
        currentURL.replace(
            "preview.html",
            "view.html"
        );
    document.getElementById(
        "shareLink"
    ).value =
        viewURL;
}
function copyLink() {
    const input =
        document.getElementById(
            "shareLink"
        );
    input.select();
    navigator.clipboard
        .writeText(input.value)
        .then(function() {
            alert(
                "Letter link copied! 💌"
            );
        })
        .catch(function() {
            alert(
                "Please copy the link manually."
            );
        });
}
async function shareLetter() {
    const link =
        document.getElementById(
            "shareLink"
        ).value;
    if (navigator.share) {
        try {
            await navigator.share({
                title:
                    "Someone left you a letter 💌",
                text:
                    "Someone left you a letter. Open it when you're ready.",
                url: link
            });
        } catch (error) {
            // User cancelled sharing.
        }
    } else {
        copyLink();
    }
}
</script>
</body>
</html>
