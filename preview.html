<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Letters I Never Send</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 18px;
            min-height: 100vh;
            background: #241f1b;
            color: #3d332b;
            font-family: Georgia, serif;
        }

        h1 {
            text-align: center;
            color: #e8dcc8;
            font-weight: normal;
        }

        .paper {
            max-width: 650px;
            margin: 30px auto;
            padding: 35px 25px;
            background: #e8dcc8;
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
        }

        #dear {
            font-size: 21px;
        }

        #letter {
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 17px;
        }

        .song {
            margin-top: 30px;
            padding: 20px;
            background: #d5c4aa;
            text-align: center;
        }

        .song-title {
            margin-bottom: 15px;
        }

        .play-button,
        .share-button {
            border: none;
            padding: 13px 20px;
            margin: 7px;
            font-family: Georgia, serif;
            cursor: pointer;
        }

        .play-button {
            background: #3d332b;
            color: #e8dcc8;
        }

        .share-button {
            background: #796a58;
            color: white;
        }

        .reflection {
            margin-top: 30px;
            padding: 20px;
            background: #d5c4aa;
            text-align: center;
            line-height: 1.6;
            font-style: italic;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #e8dcc8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h1>Letters I Never Send</h1>

<div class="paper">

    <p id="dear"></p>

    <div id="letter"></div>

    <div class="song">

        <div class="song-title">
            🎵 <strong id="song"></strong>
        </div>

        <button
            class="play-button"
            onclick="playSong()">
            ▶ Play Song
        </button>

    </div>

    <div class="reflection">

        <h3>A little reminder for you</h3>

        <p id="advice"></p>

    </div>

    <button
        class="share-button"
        onclick="shareLetter()">
        💌 Share Letter
    </button>

</div>

<a class="back" href="letter.html">
    ← Write another letter
</a>


<script>

const name =
    localStorage.getItem("letterName") || "You";

const message =
    localStorage.getItem("letterMessage") || "";

const song =
    localStorage.getItem("letterSong") ||
    "No song chosen.";


document.getElementById("dear").textContent =
    "Dear " + name + ",";

document.getElementById("letter").textContent =
    message;

document.getElementById("song").textContent =
    song;


/* Automatic reflection */

function getAdvice(text) {

    const words = text.toLowerCase();

    if (
        words.includes("miss") ||
        words.includes("missing")
    ) {
        return "Missing someone doesn't always mean you need to return to them. Sometimes it simply means they mattered.";
    }

    if (
        words.includes("sorry") ||
        words.includes("regret")
    ) {
        return "You cannot rewrite the past, but you can carry its lessons gently into tomorrow.";
    }

    if (
        words.includes("goodbye") ||
        words.includes("let go")
    ) {
        return "Letting go doesn't erase what you felt. It gives you room to keep growing.";
    }

    if (
        words.includes("love") ||
        words.includes("loved")
    ) {
        return "Some love stories end, but that doesn't make the love meaningless. Keep the memories that helped you grow.";
    }

    if (
        words.includes("hope") ||
        words.includes("maybe")
    ) {
        return "Hope can be beautiful. Just remember to leave some hope for yourself, too.";
    }

    return "Some words are meant to be written, even when we don't know where they will lead. Be gentle with your heart.";
}


document.getElementById("advice").textContent =
    getAdvice(message);


/* Song */

function playSong() {

    if (
        song.startsWith("http://") ||
        song.startsWith("https://")
    ) {

        window.open(song, "_blank");

    } else {

        alert(
            "Add a YouTube or Spotify link as the song to play it. 🎵"
        );

    }

}


/* Share */

async function shareLetter() {

    const text =
        "I left something I never got to say here. 💌";

    const url =
        window.location.href;

    if (navigator.share) {

        await navigator.share({
            title: "Letters I Never Send",
            text: text,
            url: url
        });

    } else {

        await navigator.clipboard.writeText(url);

        alert(
            "Letter link copied! 💌 Send it to them."
        );

    }

}

</script>

</body>
</html>
