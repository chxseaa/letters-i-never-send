<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>Your Letter Is Ready | Letters I Never Sent</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        min-height: 100vh;
        padding: 30px 18px;
        background: #241f1b;
        color: #e8dcc8;
        font-family: Georgia, serif;
    }
    .container {
        width: 100%;
        max-width: 650px;
        margin: auto;
    }
    h1 {
        text-align: center;
        font-size: 34px;
        font-weight: normal;
        margin-bottom: 10px;
    }
    .subtitle {
        text-align: center;
        color: #cbbda9;
        font-style: italic;
        line-height: 1.7;
    }
    .paper {
        background: #e8dcc8;
        color: #3d332b;
        padding: 35px 25px;
        margin-top: 30px;
        box-shadow:
            0 15px 40px rgba(0,0,0,.4);
    }
    .to {
        font-size: 19px;
        margin-bottom: 25px;
    }
    .message {
        white-space: pre-wrap;
        line-height: 1.9;
        font-size: 17px;
    }
    .song {
        margin-bottom: 30px;
        padding: 20px;
        border-bottom: 1px solid #b9aa94;
        text-align: center;
        font-style: italic;
    }
    .song a {
        color: #3d332b;
        word-break: break-word;
    }
    .share-box {
        margin-top: 30px;
        padding: 25px;
        border: 1px solid #796a58;
        text-align: center;
    }
    .share-box h2 {
        font-size: 21px;
        font-weight: normal;
        margin-top: 0;
    }
    .share-box p {
        color: #cbbda9;
        line-height: 1.7;
        font-style: italic;
    }
    .link {
        width: 100%;
        padding: 13px;
        border: 1px solid #b9aa94;
        background: #f1e7d6;
        color: #3d332b;
        font-family: Arial, sans-serif;
        font-size: 12px;
        outline: none;
    }
    button {
        width: 100%;
        padding: 16px;
        margin-top: 12px;
        border: none;
        background: #e8dcc8;
        color: #3d332b;
        border: 1px solid #796a58;
        font-family: Georgia, serif;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: #f1e7d6;
    }
    .share-main {
        background: #3d332b;
        color: #e8dcc8;
        border: none;
    }
    .share-main:hover {
        background: #51443a;
    }
    .back {
        text-align: center;
        margin-top: 20px;
    }
    .back a {
        color: #cbbda9;
        text-decoration: none;
    }
    .success {
        display: none;
        margin-top: 15px;
        color: #cbbda9;
        font-style: italic;
    }
</style>
</head>
<body>
<div class="container">
<h1>
    Your Letter Is Ready 💌
</h1>
<p class="subtitle">
    You wrote the words.
    <br>
    Now let them reach the person
    they're meant for.
</p>
<div class="paper">
    <div
        class="song"
        id="song"
    ></div>
    <div class="to">
        Dear
        <span id="name"></span>,
    </div>
    <div
        class="message"
        id="message"
    ></div>
</div>
<div class="share-box">
    <h2>
        Ready to send it? 💌
    </h2>
    <p>
        Your letter has been created.
        <br>
        Copy the link below and send it
        to the person you wrote it for.
    </p>
    <input
        class="link"
        id="shareLink"
        readonly
    >
    <button
        class="share-main"
        onclick="shareLetter()"
    >
        Share Letter 💌
    </button>
    <button
        onclick="copyLink()"
    >
        Copy Letter Link 🔗
    </button>
    <div
        class="success"
        id="success"
    >
        Link copied! Now send it to them. 💌
    </div>
</div>
<div class="back">
    <a href="letter.html">
        ← Write another letter
    </a>
</div>
</div>
<script>
function getLetter() {
    const params =
        new URLSearchParams(
            window.location.search
        );
    const encoded =
        params.get("letter");
    if (!encoded) {
        alert(
            "No letter was found."
        );
        return null;
    }
    try {
        return JSON.parse(
            decodeURIComponent(
                atob(encoded)
            )
        );
    } catch (error) {
        alert(
            "This letter link is invalid."
        );
        return null;
    }
}
const letter =
    getLetter();
if (letter) {
    document.getElementById(
        "name"
    ).textContent =
        letter.name;
    document.getElementById(
        "message"
    ).textContent =
        letter.message;
    const song =
        document.getElementById("song");
    if (letter.song) {
        song.innerHTML =
            "🎵 The song chosen for this letter:" +
            "<br><br>" +
            "<a href=\"" +
            letter.song +
            "\" target=\"_blank\">" +
            letter.song +
            "</a>";
    } else {
        song.style.display =
            "none";
    }
    const encoded =
        new URLSearchParams(
            window.location.search
        ).get("letter");
    const baseURL =
        window.location.href
            .split("?")[0]
            .replace(
                "preview.html",
                "view.html"
            );
    const finalLink =
        baseURL +
        "?letter=" +
        encodeURIComponent(
            encoded
        );
    document.getElementById(
        "shareLink"
    ).value =
        finalLink;
}
function copyLink() {
    const input =
        document.getElementById(
            "shareLink"
        );
    input.select();
    input.setSelectionRange(
        0,
        99999
    );
    navigator.clipboard
        .writeText(input.value)
        .then(function() {
            document.getElementById(
                "success"
            ).style.display =
                "block";
        })
        .catch(function() {
            alert(
                "Please copy the link manually."
            );
        });
}
async function shareLetter() {
    const link =
        document.getElementById(
            "shareLink"
        ).value;
    if (navigator.share) {
        try {
            await navigator.share({
                title:
                    "Someone left you a letter 💌",
                text:
                    "Someone left you a letter. Please play the song while reading.",
                url:
                    link
            });
        } catch (error) {
            // Sharing cancelled.
        }
    } else {
        copyLink();
    }
}
</script>
</body>
</html>
